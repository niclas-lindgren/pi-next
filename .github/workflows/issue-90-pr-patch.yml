name: issue-90-pr-patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.head_ref == 'agent/issue-90-remote' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-90-remote
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Apply issue 90 patch
        run: python scripts/issue-90-remote-patch.py
      - run: npm ci
      - run: npm run typecheck
      - name: Run affected CLI tests
        run: npx tsx --test --test-concurrency=1 test/cli.test.ts
      - name: Run full suite
        run: npm test
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-90-pr-patch.yml scripts/issue-90-remote-patch.py
          git add src/coordination/issue-leases.ts test/cli.test.ts
          git commit -m "test(ci): make no-authority fixture hermetic (#90)"
          git push origin HEAD:agent/issue-90-remote
