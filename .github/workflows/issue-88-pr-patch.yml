name: issue-88-pr-patch

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.head_ref == 'agent/issue-88-remote' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-88-remote
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Apply patch
        run: python scripts/issue-88-remote-patch.py
      - run: npm ci
      - run: npm run typecheck
      - name: Run issue 88 bootstrap regressions
        run: npx tsx --test --test-concurrency=1 test/bootstrap-self-host.test.ts
      - name: Run full suite allowing only proven issue 90 CI baseline failure
        run: |
          set +e
          npm test 2>&1 | tee /tmp/pi-next-full-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          test "$(grep -c '^not ok ' /tmp/pi-next-full-test.log)" -eq 1
          grep -F 'not ok 77 - status never throws for a fixture with no resolvable GitHub repository' /tmp/pi-next-full-test.log
          grep -F '# pass 228' /tmp/pi-next-full-test.log
          grep -F '# fail 1' /tmp/pi-next-full-test.log
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-88-remote-patch.yml .github/workflows/issue-88-pr-patch.yml scripts/issue-88-remote-patch.py
          git add scripts/bootstrap-self-host.ts test/bootstrap-self-host.test.ts
          git commit -m "fix(dev): capture Pi reviewer verdict from message stream (#88)"
          git push origin HEAD:agent/issue-88-remote
