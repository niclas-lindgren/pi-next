name: issue-76-verify

on:
  push:
    branches:
      - agent/issue-76-scenarios
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-76-scenarios
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Scripted worker and lifecycle scenarios
        run: node --import tsx --test test/scripted-worker-adapter.test.ts test/lifecycle-scenarios.test.ts test/git-fixture.test.ts
      - name: Full guarded suite
        run: npm test
      - name: Remove temporary verifier
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-76-verify.yml
          git commit -m "chore: remove temporary #76 verifier"
          git push origin HEAD:agent/issue-76-scenarios
