name: issue-14-verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.head_ref == 'agent/issue-14-remote' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-14-remote
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Prove tests cannot bypass the suite Git guard with an absolute executable
        run: |
          if grep -R -nE "['\"](/usr/bin/git|/opt/.*/git)['\"]|PI_NEXT_TEST_REAL_GIT" test --include='*.ts'; then
            echo 'Tests must invoke git through PATH; only the safety harness may know the real git executable.' >&2
            exit 1
          fi
      - run: npm test
      - run: npm run package-smoke
      - name: Remove temporary verification workflow and commit verified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-14-inventory.yml
          git add package.json scripts/run-tests-safe-git.mjs scripts/test-git-guard.mjs test/git-safety.test.ts
          git commit -m "test: isolate Git mutation fixtures from real remotes (#14)"
          git push origin HEAD:agent/issue-14-remote
