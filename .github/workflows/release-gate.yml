name: Release gate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag to verify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag, commit, and release notes
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          PI_NEXT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/verify-release.mjs

      - name: Run zero-token Tier 1 shared-kernel qualification
        run: npm run qualify:tier1

      - name: Run full deterministic test suite
        run: npm test

      - name: Run disposable consumer Tier 2 smoke
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: npm run qualify:tier2
