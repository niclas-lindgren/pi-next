name: Release gate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag to verify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install bubblewrap (worker shell OS sandbox)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor.
          # `bwrap --unshare-all` run as the non-root runner user needs them;
          # this is a disposable CI VM, so relax the restriction.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Fail fast with a clear signal if the OS sandbox cannot start, using
          # the same base namespace/mount layout the worker shell uses.
          bwrap --unshare-all --die-with-parent --new-session --proc /proc --dev /dev --tmpfs /tmp --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 -- /bin/true

      - name: Verify tag, commit, and release notes
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          PI_NEXT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/verify-release.mjs

      - name: Run zero-token Tier 1 shared-kernel qualification
        run: npm run qualify:tier1

      - name: Run full deterministic test suite
        run: npm test

      - name: Run disposable consumer Tier 2 smoke
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: npm run qualify:tier2
