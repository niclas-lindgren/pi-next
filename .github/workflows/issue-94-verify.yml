name: issue-94-verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.head_ref == 'agent/issue-94-remote' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-94-remote
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run migrated fixture regressions
        run: node scripts/run-tests-safe-git.mjs test/git-fixture.test.ts test/checkpoint.test.ts test/workspace-cleanup.test.ts
      - run: npm test
      - name: Remove temporary verification workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-94-verify.yml
          git commit -m "chore(test): remove temporary issue 94 verifier"
          git push origin HEAD:agent/issue-94-remote
